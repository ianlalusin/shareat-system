<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff roster live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b2620;text-decoration:none}a:hover{color:#d40909}
.disp{font-family:'Baloo 2',sans-serif;font-weight:800;letter-spacing:-.01em}
.row{display:grid;grid-template-columns:minmax(220px,1.4fr) 110px minmax(320px,2.4fr) 90px 150px;gap:20px;align-items:center;padding:14px 8px;border-bottom:1px solid #eadfc6}
.row:hover{background:#fffdf8}
.hd{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b5f4f;border-bottom:2px solid #2b2620}
.av{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:#fff;flex:none;box-shadow:0 0 0 3px #fbf4e4,0 0 0 5px var(--ring)}
.strip{position:relative;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,#efe4cc 0 calc(100%/18 - 1px),#e4d7bb calc(100%/18 - 1px) calc(100%/18))}
.sched{position:absolute;top:-4px;bottom:-4px;border:2px dashed #94866f;border-radius:8px}
.work{position:absolute;top:3px;bottom:3px;border-radius:4px;background:#0e6b45;transform-origin:left;animation:grow 1s cubic-bezier(.16,1,.3,1) both}
.brk{position:absolute;top:3px;bottom:3px;border-radius:4px;background:repeating-linear-gradient(45deg,#f4b942 0 4px,#fce8b8 4px 8px)}
.nowl{position:absolute;top:-8px;bottom:-8px;width:2px;background:#d40909}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st b{width:8px;height:8px;border-radius:99px;background:currentColor}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.rs *{animation:none!important}}
</style>
</helmet>
<div class="rs" style="box-sizing: border-box; background: #fbf4e4; color: #2b2620; font-family: 'Plus Jakarta Sans', sans-serif; padding: 32px clamp(16px, 4vw, 64px) 64px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6b5f4f">People · Thursday 9 Oct · 8:12 pm</p><h1 class="disp" style="margin: 0; font-size: 52px; line-height: .95">Who's working</h1></div>
<div style="display: flex; gap: 28px; flex-wrap: wrap">
<div><div class="disp" style="font-size: 48px; line-height: .9; color: #0e6b45">46</div><div style="font-size: 13px; color: #6b5f4f">on shift</div></div>
<div><div class="disp" style="font-size: 48px; line-height: .9; color: #7a4f00">4</div><div style="font-size: 13px; color: #6b5f4f">on break</div></div>
<div><div class="disp" style="font-size: 48px; line-height: .9">8</div><div style="font-size: 13px; color: #6b5f4f">off today</div></div>
<div><div class="disp" style="font-size: 48px; line-height: .9; color: #a00606">2</div><div style="font-size: 13px; color: #6b5f4f">late, not in yet</div></div>
</div>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: #6b5f4f; align-items: center">
<span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 22px; height: 10px; border-radius: 3px; background: #0e6b45"></span>Worked</span>
<span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 22px; height: 10px; border-radius: 3px; background: repeating-linear-gradient(45deg,#f4b942 0 4px,#fce8b8 4px 8px)"></span>Break</span>
<span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 22px; height: 10px; border-radius: 3px; border: 2px dashed #94866f"></span>Scheduled</span>
<span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 2px; height: 14px; background: #d40909"></span>Now</span>
</div>
<div style="overflow-x: auto"><div style="min-width: 960px">
<div class="row hd"><span>Person</span><span>Store</span><span style="display: flex; justify-content: space-between"><span>6a</span><span>10a</span><span>2p</span><span>6p</span><span>10p</span><span>12a</span></span><span style="text-align: right">Hours, cutoff</span><span>Right now</span></div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
<a href="#" class="row">
<span style="display: flex; align-items: center; gap: 14px; min-width: 0"><span class="av" style="background: {{ r.tone }}; --ring: {{ r.ring }}">{{ r.ini }}</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 700; font-size: 15px">{{ r.name }}</span><span style="font-size: 13px; color: #6b5f4f">{{ r.role }}</span></span></span>
<span style="font-size: 14px">{{ r.store }}</span>
<span class="strip"><span class="sched" style="left: {{ r.sL }}%; width: {{ r.sW }}%"></span><sc-if value="{{ r.worked }}" hint-placeholder-val="{{ true }}"><span class="work" style="left: {{ r.wL }}%; width: {{ r.wW }}%; animation-delay: {{ r.delay }}"></span></sc-if><sc-if value="{{ r.hasBreak }}" hint-placeholder-val="{{ false }}"><span class="brk" style="left: {{ r.bL }}%; width: {{ r.bW }}%"></span></sc-if><span class="nowl" style="left: 79%"></span></span>
<span style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 700">{{ r.hours }}</span>
<span><span class="st" style="background: {{ r.stBg }}; color: {{ r.stFg }}"><b></b>{{ r.stText }}</span></span>
</a>
</sc-for>
</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
var pct = function (h) { return ((h - 6) / 18 * 100).toFixed(2); };
var span = function (a, b) { return ((b - a) / 18 * 100).toFixed(2); };
var S = {
on: ['#e2f1e8', '#0e6b45', '#0e6b45'], br: ['#fce8b8', '#7a4f00', '#f4b942'], off: ['#efece4', '#55606e', '#c9bda6'], late: ['#fde7e7', '#a00606', '#a00606']
};
var R = [
['Marites Dela Cruz', 'Store manager', 'Lipa', [10, 22], [9.87, 20.2], null, '88.5', 'on', 'On shift · 10h 20m'],
['Jomar Villanueva', 'Grill master', 'Lipa', [17, 24], [16.97, 20.2], null, '72.0', 'on', 'On shift · 3h 14m'],
['Kristine Abad', 'Cashier', 'Lipa', [15, 23], [14.95, 20.2], [19.97, 20.2], '64.5', 'br', 'Break · 12 min'],
['Paolo Reyes', 'Server', 'Lipa', [17, 24], [17.02, 20.2], null, '58.0', 'on', 'On shift · 3h 11m'],
['Carlo Espiritu', 'Server', 'Lipa', [17, 24], null, null, '41.5', 'late', 'Late · 1h 12m'],
['Liza Mendoza', 'Store manager', 'Davao', [10, 22], [10.33, 20.2], [14, 14.5], '86.0', 'on', 'On shift · 9h 52m'],
['Ronnel Bautista', 'Grill master', 'Davao', null, null, null, '70.0', 'off', 'Rest day'],
['Rowena Castillo', 'Commissary lead', 'Commissary', [6, 15], [6, 15.2], [11, 11.5], '91.0', 'off', 'Out at 3:12 pm'],
['Mark Anthony Lim', 'Driver', 'Commissary', [8, 17], [8.1, 20.2], null, '96.5', 'on', 'Overtime · 3h 12m'],
['Joshua Ramos', 'Server', 'Malvar', [16, 23], [16.1, 20.2], [20.13, 20.2], '30.0', 'br', 'Break · 4 min']
];
var tones = ['#2b2620', '#a8730f', '#0e6b45', '#1e4fb8', '#6427c9', '#a00606'];
return {
rows: R.map(function (r, i) {
var p = r[0].split(' '); var s = S[r[7]];
return { name: r[0], role: r[1], store: r[2], ini: p[0][0] + p[p.length - 1][0], tone: tones[i % 6], ring: s[2],
sL: r[3] ? pct(r[3][0]) : '0', sW: r[3] ? span(r[3][0], r[3][1]) : '0',
worked: !!r[4], wL: r[4] ? pct(r[4][0]) : '0', wW: r[4] ? span(r[4][0], r[4][1]) : '0',
hasBreak: !!r[5], bL: r[5] ? pct(r[5][0]) : '0', bW: r[5] ? span(r[5][0], r[5][1]) : '0',
hours: r[6], stBg: s[0], stFg: s[1], stText: r[8], delay: (i * 0.06) + 's' };
})
};
}
}
</script>
</body>
</html>
