name: Deploy

# T-205 — first production deployment. Gated on `CI` (ci.yml) succeeding on `main`, per Ian's
# decision to auto-deploy every green push. NEVER builds on the droplet (bible §2.10 / RULES
# rule 11) — everything through "prune devDependencies" runs on the runner; the droplet only
# receives a finished artifact, runs migrations against it, and restarts.
#
# ⚠️ 2026-09-04: this now targets a NEW droplet dedicated to shareat-system, NOT the old shared
# 159.223.78.207 (ERPNext + POS archive DB) — Ian's call, so a build here never risks that box.
# DEPLOY_HOST has no fallback on purpose: silently defaulting to the old droplet if the secret
# were ever unset would ship this app onto someone else's live production box. Fail closed instead.
#
# GitHub Secrets this workflow reads (checklist §4b — Ian sets these, never through an agent):
# DEPLOY_SSH_KEY, DEPLOY_HOST (the new droplet's IP — REQUIRED, no default, checked by the
# "Require DEPLOY_HOST" step below), NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
# NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET, NEXT_PUBLIC_FIREBASE_APP_ID.
# tests/unit/deploy-secrets-list.test.ts asserts this list against the file's own secrets.* reads,
# both ways, so it cannot drift the way it did before DEF-346 (measured 2026-09-14: this comment
# named eleven, the workflow read seven).
#
# NOT GitHub Secrets — runtime values read from /srv/shareat-shared/.env.local on the droplet,
# never set here: DATABASE_URL, SESSION_SECRET, FIREBASE_PROJECT_ID, and
# FIREBASE_SERVICE_ACCOUNT_KEY_FILE (a path — the key itself is never in Secrets). Confusing these
# with Secrets was DEF-346's failure mode.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DEPLOY_USER: shareat

jobs:
  deploy:
    name: build, ship, migrate, restart
    # Same switch as ci.yml (docs/ops/self-hosted-runner.md). Building on Ian's machine is still "build
    # in CI, never on the droplet" (bible §2.10): the droplet receives the finished artifact either way.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout the exact commit CI verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require DEPLOY_HOST (fail closed — never guess a production target)
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST is not set. This must be the NEW dedicated droplet's IP —" \
                 "there is deliberately no fallback, so a missing secret never silently deploys" \
                 "to the wrong box."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (full — needed to build)
        run: npm ci --no-audit --no-fund

      - name: Deploy preflight (DEF-235 — fail closed on a missing, empty, or padded secret)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run deploy-preflight

      - name: Write the deployed revision (T-308 Slice A — publish which commit this build is)
        env:
          DEPLOY_REVISION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run write-revision -- --require

      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      # >>> POS v2 (stripped by tests/unit/ci-app-jobs.test.ts case 13; the ERP bytes stay pinned)
      # POS v2's web process (T-424 server routes, pos2.shareat.net). Web build only: the APK is built by
      # app-build.yml with build:cap, which never ships server code. Runbook §6. A POS build failure must
      # never block an ERP deploy: the step may fail, and the artifact then ships without POS.
      # DEF-753: `next build` creates .next before it can fail, so only a build that exits 0 leaves
      # apps/pos/.pos-build-ok. Packaging and the server key on that marker, never on .next.
      - name: Build POS v2 (web)
        continue-on-error: true
        env:
          NODE_ENV: production
        run: rm -f apps/pos/.pos-build-ok && npm run build -w @shareat/pos && touch apps/pos/.pos-build-ok

      # <<< POS v2
      - name: Prune devDependencies (bible §8 — runtime deps only from here on)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Package the artifact
        run: |
          # apps/erp/public is optional — Next only needs it if it exists (no static assets today)
          PATHS="apps/erp/.next apps/erp/package.json apps/erp/next.config.js packages scripts package.json package-lock.json node_modules"
          [ -d apps/erp/public ] && PATHS="$PATHS apps/erp/public"
          # >>> POS v2 (apps/pos/node_modules holds packages that clash with the root: firebase 10, T-422 rule 7)
          if [ -f apps/pos/.pos-build-ok ]; then
            PATHS="$PATHS apps/pos/.next apps/pos/.pos-build-ok apps/pos/package.json apps/pos/next.config.mjs apps/pos/config apps/pos/public"
            [ -d apps/pos/node_modules ] && PATHS="$PATHS apps/pos/node_modules"
          fi
          # <<< POS v2
          tar -czf /tmp/shareat-artifact.tar.gz \
            --exclude='.git' \
            --exclude='secrets' \
            --exclude='**/*.test.ts' \
            --exclude='**/tests' \
            $PATHS

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship the artifact (shareat user only — never root)
        run: |
          scp -i ~/.ssh/deploy_key /tmp/shareat-artifact.tar.gz \
            "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/shareat-artifact.tar.gz"

      - name: Unpack, migrate, restart
        run: |
          # Releases/current-symlink pattern (provision.sh sets up the directories once):
          #   /srv/shareat-releases/<ts>/   each deploy unpacks into its own timestamped dir
          #   /srv/shareat -> .../releases/<ts>   symlink, swapped atomically at the end
          #   /srv/shareat-shared/.env.local      persistent, never shipped, symlinked in
          # A failed unpack or failed migration never touches the currently-running release.
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            RELEASE="/srv/shareat-releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE"
            tar -xzf /tmp/shareat-artifact.tar.gz -C "$RELEASE"
            rm -f /tmp/shareat-artifact.tar.gz
            ln -sf /srv/shareat-shared/.env.local "$RELEASE/.env.local"

            cd "$RELEASE"
            SYSTEM_DB_URL="$(grep -m1 '^SYSTEM_DATABASE_URL=' /srv/shareat-shared/.env.local | cut -d= -f2- || true)"
            # DEF-196/DEF-203: this file has a documented history of CRLF line endings and a BOM
            # on the box; strip a trailing CR and one layer of surrounding quotes before judging
            # the value empty, so a decorated-but-present key is never misreported as absent.
            SYSTEM_DB_URL="${SYSTEM_DB_URL%$'\r'}"
            case "$SYSTEM_DB_URL" in
              \"*\") SYSTEM_DB_URL="${SYSTEM_DB_URL#\"}"; SYSTEM_DB_URL="${SYSTEM_DB_URL%\"}" ;;
              \'*\') SYSTEM_DB_URL="${SYSTEM_DB_URL#\'}"; SYSTEM_DB_URL="${SYSTEM_DB_URL%\'}" ;;
            esac
            if [ -z "$SYSTEM_DB_URL" ]; then
              echo "::error::SYSTEM_DATABASE_URL is missing or empty in /srv/shareat-shared/.env.local — migrations need the admin connection string (docs/ops/README.md § THE CONSEQUENCE THAT WILL BITE). Refusing to run db:migrate rather than let it fail inside migrate.ts with an unrelated 'DATABASE_URL is not set'." >&2
              exit 1
            fi
            DATABASE_URL="$SYSTEM_DB_URL" npm run db:migrate

            # >>> POS v2 (DEF-753): a release without a good POS build keeps the last good POS; never fatal
            POS_RESTART=0
            if [ -f "$RELEASE/apps/pos/.pos-build-ok" ]; then
              POS_RESTART=1
            else
              PREV_RELEASE="$(readlink -f /srv/shareat 2>/dev/null || true)"
              if [ -n "$PREV_RELEASE" ] && [ "$PREV_RELEASE" != "$RELEASE" ] && { [ -f "$PREV_RELEASE/apps/pos/.pos-build-ok" ] || [ -d "$PREV_RELEASE/apps/pos/.next" ]; }; then
                if rm -rf "$RELEASE/apps/pos" && cp -a "$PREV_RELEASE/apps/pos" "$RELEASE/apps/pos"; then
                  echo "::warning::POS v2 did not build in this deploy; kept the last good POS from $PREV_RELEASE (not restarted)"
                else
                  rm -rf "$RELEASE/apps/pos" || true
                  echo "::warning::POS v2 carry-forward failed (copy from $PREV_RELEASE); POS left as is, ERP deploy continues"
                fi
              else
                echo "POS v2: no good POS build in this release and none to carry forward; not restarting it"
              fi
            fi
            # <<< POS v2
            ln -sfn "$RELEASE" /srv/shareat.new
            mv -Tf /srv/shareat.new /srv/shareat
            sudo /usr/bin/systemctl restart shareat-erp.service
            # >>> POS v2: restarts only once its unit is installed (runbook §4); a failure never stops the ERP deploy
            if [ "$POS_RESTART" = 1 ] && [ -f /etc/systemd/system/shareat-pos.service ]; then
              sudo /usr/bin/systemctl restart shareat-pos.service || echo "POS v2 restart failed; ERP unaffected" >&2
            fi
            # <<< POS v2

            # Keep the last 3 releases only
            ls -1dt /srv/shareat-releases/*/ | tail -n +4 | xargs -r rm -rf
          REMOTE

      - name: Confirm the app is up
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            for i in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null http://127.0.0.1:9008/api/health; then
                echo "healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 5
            done
            echo "health check failed after 30s — restart did not bring the app up" >&2
            exit 1
          REMOTE

      # >>> POS v2: after the ERP check, so a POS failure is visible without hiding a healthy ERP
      - name: Confirm POS v2 is up (when installed)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            if [ ! -f /etc/systemd/system/shareat-pos.service ]; then
              echo "POS v2 unit not installed yet: shipped, not started"
              exit 0
            fi
            for i in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null http://127.0.0.1:9009/api/pos2/health; then
                echo "POS v2 healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 5
            done
            echo "POS v2 health check failed after 30s" >&2
            exit 1
          REMOTE

      # <<< POS v2
      # A GitHub-hosted runner is thrown away after the job, taking the key with it. A self-hosted
      # runner (docs/ops/self-hosted-runner.md) is not, so the production SSH key and the artifact
      # are removed explicitly, pass or fail.
      - name: Remove the deploy key and artifact from the runner
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/shareat-artifact.tar.gz
