name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # T-306: a push that only touches documentation still ran the full ~11-minute job (typecheck,
  # unit, real-Postgres integration, a production build) — no path filter existed at all. Skipping
  # the WHOLE job on `docs/**` would be a bug here: `tests/unit/toc-freshness.test.ts` genuinely
  # tests documentation (PROJECT_BIBLE.md's table of contents), so a docs change can legitimately
  # fail a real gate. This job decides ONLY whether the expensive, code-only steps (integration
  # against real Postgres, the build) are needed — typecheck and unit always run regardless of its
  # answer, in the `verify` job below.
  changes:
    name: detect doc-only changes
    # Self-hosted switch (docs/ops/self-hosted-runner.md): set the repository variable CI_RUNNER to the
    # runner's label (shareat-local) and the job runs on Ian's machine, which uses no GitHub-hosted
    # minutes. Unset or empty = GitHub-hosted, so deleting the variable is the rollback.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      pos: ${{ steps.apps.outputs.pos }}
      customer: ${{ steps.apps.outputs.customer }}
    steps:
      # fetch-depth: 0 — a shallow clone would not contain `before`'s commit object, and the diff
      # below needs to read it. This job is the only one that needs full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FAILS OPEN, always, by construction: every path that cannot determine the changed-file list
      # with confidence sets docs_only=false and stops — never docs_only=true by default or by
      # falling through. A cost optimisation that silently skips integration on a real code change
      # would cost far more than it saves.
      #
      # Classification (deliberate, not a `docs/**` glob — T-306's own brief named two traps):
      #   - `docs/ops/**` is EXCLUDED even though it sits under docs/ and one file in it is
      #     `.md` — the directory also holds `provision.sh` and the systemd `.service`/`.timer`
      #     units actually installed on the production host. Not prose; treated as code.
      #   - `docs/production-caller-baseline.txt` is EXCLUDED — a generated artefact
      #     `tests/unit/production-caller-ratchet.test.ts` asserts against, not hand-written prose.
      #     (Unit always runs regardless, so this exclusion is belt-and-suspenders, not the only
      #     thing standing between a bad baseline edit and a green run — it's here so a change to a
      #     generated data file is never classified as "documentation" on principle.)
      #   - Everything else under `docs/**`, plus any `*.md` anywhere in the repo (README-style
      #     files inside packages, ADRs, etc.), counts as documentation.
      - name: Determine docs-only
        id: check
        run: |
          set -uo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
            AFTER="${{ github.event.pull_request.head.sha }}"
          fi

          # First push to a branch (before is the all-zero SHA), or an event shape this script
          # doesn't recognise (e.g. workflow_dispatch, which carries neither `before` nor a PR
          # payload): no base to diff against — run everything.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::T-306: no usable base SHA for this event ($GITHUB_EVENT_NAME) — running everything"
            exit 0
          fi

          # A force-push's old tip can be unreachable even after a full-history checkout (it may no
          # longer be an ancestor of anything GitHub still serves) — `git diff` then fails loudly,
          # which this catches rather than silently trusting an empty result.
          if ! CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" 2>&1)"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::T-306: git diff $BEFORE..$AFTER failed — running everything. $CHANGED"
            exit 0
          fi

          if [ -z "$CHANGED" ]; then
            # Nothing changed between the two SHAs (e.g. an empty merge commit) — vacuously
            # docs-only: there is no code for the skipped steps to have anything to say about.
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DOCS_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/ops/*) DOCS_ONLY=false ;;
              docs/production-caller-baseline.txt) DOCS_ONLY=false ;;
              *.md|docs/*) : ;;
              *) DOCS_ONLY=false ;;
            esac
          done <<< "$CHANGED"

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "::notice::T-306: docs_only=$DOCS_ONLY for $BEFORE..$AFTER"

      - name: Determine affected apps
        id: apps
        # T-417: which app jobs (app-pos, app-customer) must run. Same BEFORE/AFTER logic as the step above,
        # but the answer is per app. FAILS OPEN: anything uncertain (no base SHA, a failed diff, a missing
        # node) is UNKNOWN, and the script answers "both apps".
        run: |
          set -uo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
            AFTER="${{ github.event.pull_request.head.sha }}"
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="UNKNOWN"
          elif ! CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" 2>&1)"; then
            CHANGED="UNKNOWN"
          fi

          if ! RESULT="$(echo "$CHANGED" | node scripts/ci-affected-apps.mjs)"; then
            RESULT="$(echo pos=true; echo customer=true)"
          fi
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "::notice::T-417: $(echo $RESULT)"

  verify:
    name: typecheck, test, build
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}  # see the note on `changes`

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shareat_test
        ports: ['5435:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only throwaway values. Real secrets live in GitHub Secrets, never here.
      NODE_ENV: test
      APP_TIMEZONE: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@localhost:5435/shareat_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/shareat_test
      SESSION_SECRET: ci-only-not-a-real-secret-000000000000
      FIREBASE_PROJECT_ID: ci
      FIREBASE_SERVICE_ACCOUNT_KEY: '{}'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci
      NEXT_PUBLIC_FIREBASE_APP_ID: ci

    steps:
      # fetch-depth: 0 — t334-slice3-tranche1-input.test.ts reads its "before" state from a pinned
      # commit (`git show <sha>:<path>`); a shallow clone lacks it and the unit step fails (DEF-432).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # DEF-631: tsc outgrew node's ~2 GB default heap on 10 Oct (PR #10: exit 134, heap out of memory).
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests
        run: npm run test

      # T-251 / DEF-218 Contract 1: the restricted test role, cluster-wide, idempotent.
      # Must run before migrations apply the per-database grants that give it teeth.
      #
      # ⭐ DEF-218 CLOSED 2026-09-12 — the role is now ON BY DEFAULT, so this step is no longer
      # preparation for a later flip: it is a HARD PREREQUISITE of the integration step below.
      # tests/integration/setup.ts arms the restricted role unless INTEGRATION_RESTRICTED_ROLE
      # is explicitly '0', and nothing sets it here. ⛔ Delete or reorder this step and every
      # integration test fails to connect — loudly, which is the correct direction.
      # Evidence for the flip: 116 files / 2747 tests / 0 failed, one clean single-invocation run.
      # T-306: these four steps are the ~8 (of ~11) minutes a docs-only push has no way to need —
      # nothing here can be affected by a Markdown edit. Skipped only when `changes` positively
      # determined docs-only; any uncertain answer from that job already came back `false` above,
      # so `!= 'true'` here runs everything on any value other than the literal string "true".
      - name: Provision restricted test role
        if: needs.changes.outputs.docs_only != 'true'
        run: node scripts/provision-test-role.mjs

      - name: Apply migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run db:migrate

      # T-400: one cloned DB per vitest worker. Remove INTEGRATION_WORKERS to roll back to serial.
      # 2 workers, not 4: the self-hosted runner's WSL VM is capped at 8 CPUs / 6 GB (11 Oct), and
      # 2 x ~22 connections stays far under max_connections=100, so DATABASE_POOL_MAX stays default.
      - name: Create integration worker DBs (T-400)
        if: needs.changes.outputs.docs_only != 'true'
        run: node scripts/make-integration-worker-dbs.mjs 2

      # T-393: the backup tests run the REAL pg_dump / pg_restore / pg_dumpall, and pg_dump refuses a server newer
      # than itself (the service container is postgres:18). The runner's stock client is older, so install PGDG's.
      - name: PostgreSQL 18 client (T-393)
        if: needs.changes.outputs.docs_only != 'true'
        # The self-hosted runner (ians-pc) has no passwordless sudo: it carries the client pre-installed, so skip.
        run: |
          if [ -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            echo "PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      - name: Integration tests (real Postgres)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          INTEGRATION_WORKERS: '2'
        run: npm run test:integration

      # >>> Customer lobby
      # T-455: the customer lobby server tests need real Postgres, so they run here (the app-customer job has no database).
      # The tests set LOBBY_* and DATABASE_URL themselves; the job env supplies TEST_DATABASE_URL.
      - name: Customer server integration tests (real Postgres)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:integration -w @shareat/customer

      # <<< Customer lobby
      # PROJECT_BIBLE.md §2 rule 10 / §8 Rule 1:
      # the production droplet NEVER builds. Builds happen here, and only here.
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run build

  app-pos:
    # T-417: the app jobs. Each runs only when its own output is true, on GitHub-hosted runners
    # (app-build.yml pins ubuntu-latest) so they never queue on the self-hosted runner that serves `verify`.
    name: apps/pos
    needs: changes
    if: needs.changes.outputs.pos == 'true'
    uses: ./.github/workflows/app-build.yml
    with:
      app: pos
    secrets: inherit

  app-customer:
    name: apps/customer
    needs: changes
    if: needs.changes.outputs.customer == 'true'
    uses: ./.github/workflows/app-build.yml
    with:
      app: customer
    secrets: inherit
